[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lysis"
version = "0.1.1"
description = "Fibrinolysis multiscale model (0.1.x maintenance line)"
requires-python = ">=3.10,<3.11"

# Runtime dependencies of the lysis package at the 0.1.x release line.
# These are pinned to the exact versions from the known-good `lysis-bak`
# conda environment (Python 3.10) that this release was run against. Newer
# major versions (numpy 2.x / pandas 2.x) are incompatible with this code.
dependencies = [
    "numpy==1.24.1",
    "pandas==1.5.3",
    # scipy (scipy.stats) is used by the 0.1.x analysis notebooks.
    "scipy==1.10.0",
    "tqdm==4.64.1",
    # matplotlib (plotting) and GooseSLURM (HPC job submission) are core here:
    # the 0.1.x notebooks were the primary way of driving the model, so these
    # are not optional extras.
    "matplotlib==3.6.3",
    "GooseSLURM==0.12.4",
    # Notebook interface: JupyterLab + the Octave kernel (the 0.1.x notebooks
    # were driven from Octave), plus jupyter-black (pulls in black) for
    # in-notebook formatting. Versions match the release-era / lysis-bak env.
    "jupyterlab==3.5.2",
    "octave-kernel==0.35.1",
    # jupyter-black pulls in black; pin black to the release-era version
    # (lysis-bak had 22.12.0) rather than letting it float to a modern release.
    "jupyter-black==0.3.3",
    "black==22.12.0",
]

# NOTE: The GPU path (cupy/nvtx, imported lazily in cp_macroscale.py) is
# intentionally NOT declared here. cupy resolution is CUDA/host specific and
# cannot be locked portably; install it separately to match your GPU/CUDA
# stack when the GPU macroscale model is needed.

[tool.setuptools.packages.find]
where = ["src/python"]
include = ["lysis*"]
