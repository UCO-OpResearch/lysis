[build-system]
requires = ["setuptools>=77.0", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "lysis"
dynamic = ["version"]
description = "Blood clot lysis simulation and data tools"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "h5py>=3.0",
    "pint>=0.20",
    "click>=8.0",
    "rich>=13.0",
    "sympy>=1.12",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "pandas>=2.0",
    "tqdm>=4.65",
    "GooseSLURM>=0.13.4",
]

[project.optional-dependencies]
gpu = [
    "cupy>=12.0",
    "nvtx>=0.2",
]
test = [
    "pytest>=7.0",
]
notebooks = [
    "ipython>=8.0",
    "networkx>=3.0",
    "jupyter-black>=0.3",
    "black>=23.0",
    "jupyterlab>=4.6.2",
    "octave-kernel>=0.39.0",
    "ipywidgets>=8.1.8",
]

[project.scripts]
lysis = "lysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
# Version is derived from the nearest git tag (e.g. v0.3.0 -> 0.3.x.devN+gHASH).
# fallback_version keeps builds working where git history is unavailable
# (e.g. a source tarball or a shallow ReadTheDocs clone with no tags).
fallback_version = "0.0.0"

[tool.uv]
# Always use a uv-downloaded Python; never link against system/module Python.
# Without this, the .venv ends up linked to the GCCcore Python that LMod
# modules (e.g. Octave/foss-2023a) pull in, which becomes inaccessible after
# `module purge` in the Slurm preamble — the resulting `.venv/bin/python`
# fails with "libpython3.11.so.1.0: cannot open shared object file".
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_data: tests requiring the full ~665MB dataset (skipped if missing)",
    "fortran_binary: tests requiring a compiled Fortran executable (~37s per run)",
]
# sympy 1.14's `sympy.core.evalf.bitcount` still calls `mpmath.libmp.bitcount`,
# which mpmath 1.4 deprecated. The warning fires from any code path that
# triggers sympy evalf (e.g. `lysis.config.param_resolver.resolve_micro_params`,
# which builds `sympy.Eq` / `sympy.solve` calls). We can't fix the upstream
# chain, so silence this one specific deprecation to keep test output clean.
#
# TODO(sympy>=1.15): remove this filter once sympy ships the fix.
#   Fix merged to sympy main 2025-05-11 as PR #28060
#   (https://github.com/sympy/sympy/pull/28060), expected in the 1.15 release.
#   When sympy 1.15 is out: bump the `sympy>=1.12` pin in [project].dependencies,
#   confirm the test suite runs warning-free without this filter, then delete.
filterwarnings = [
    "ignore:bitcount function is deprecated:DeprecationWarning:mpmath.libmp.libintmath",
]

[tool.black]
line-length = 88
target-version = ["py310"]
