[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lysis"
version = "0.1.1"
description = "Fibrinolysis multiscale model (0.1.x maintenance line)"
requires-python = ">=3.10,<3.11"

# Runtime dependencies of the lysis package at the 0.1.x release line.
# These are pinned to the exact versions from the known-good `lysis-bak`
# conda environment (Python 3.10) that this release was run against. Newer
# major versions (numpy 2.x / pandas 2.x) are incompatible with this code.
dependencies = [
    "numpy==1.24.1",
    "pandas==1.5.3",
    # tabulate backs pandas' DataFrame.to_markdown(), which the 0.1.x
    # analysis notebooks use to emit result tables. It was not in the
    # lysis-bak environment, so there is no known-good version to match;
    # 0.9.0 (Oct 2022) is the release-era version, contemporaneous with
    # the pinned pandas/matplotlib.
    "tabulate==0.9.0",
    # scipy (scipy.stats) is used by the 0.1.x analysis notebooks.
    "scipy==1.10.0",
    "tqdm==4.64.1",
    # matplotlib (plotting) and GooseSLURM (HPC job submission) are core here:
    # the 0.1.x notebooks were the primary way of driving the model, so these
    # are not optional extras.
    "matplotlib==3.6.3",
    # matplotlib-inline is pulled in transitively (ipython/ipykernel). Pin it
    # to the release-era version: newer 0.2.x calls rcParams._get(), a private
    # API absent in matplotlib 3.6.3, which breaks the inline backend.
    "matplotlib-inline==0.1.6",
    "GooseSLURM==0.12.4",
    # Notebook interface: JupyterLab + the Octave kernel (the 0.1.x notebooks
    # were driven from Octave), plus jupyter-black (pulls in black) for
    # in-notebook formatting. Versions match the release-era / lysis-bak env.
    "jupyterlab==3.5.2",
    # ipywidgets provides IProgress, which `tqdm.auto` needs to render its
    # progress bars inside the notebook (without it tqdm emits a warning).
    "ipywidgets==8.0.4",
    "octave-kernel==0.35.1",
    # jupyter-black pulls in black; pin black to the release-era version
    # (lysis-bak had 22.12.0) rather than letting it float to a modern release.
    "jupyter-black==0.3.3",
    "black==22.12.0",
]

# NOTE: The GPU path (cupy/nvtx, imported lazily in cp_macroscale.py) is
# intentionally NOT declared here. cupy resolution is CUDA/host specific and
# cannot be locked portably; install it separately to match your GPU/CUDA
# stack when the GPU macroscale model is needed.

[tool.setuptools.packages.find]
where = ["src/python"]
include = ["lysis*"]

[tool.uv]
# Pin transitive dependencies to the versions from the known-good
# lysis-bak environment, so indirect deps do not float to modern
# releases that assume a newer matplotlib/jupyter than this 0.1.x
# stack (which broke black, matplotlib-inline, etc.). Only packages
# present in lysis-bak are constrained; these are upper/lower caps,
# so packages not pulled in are simply ignored.
