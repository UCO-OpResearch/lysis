[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lysis"
version = "0.1.0"
description = "Blood clot lysis simulation and data tools"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "h5py>=3.0",
    "pint>=0.20",
    "click>=8.0",
    "rich>=13.0",
    "sympy>=1.12",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "pandas>=2.0",
    "tqdm>=4.65",
    "GooseSLURM>=0.13.4",
]

[project.optional-dependencies]
gpu = [
    "cupy>=12.0",
    "nvtx>=0.2",
]
test = [
    "pytest>=7.0",
]
notebooks = [
    "ipython>=8.0",
    "networkx>=3.0",
    "jupyter-black>=0.3",
    "black>=23.0",
]

[project.scripts]
lysis = "lysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_data: tests requiring the full ~665MB dataset (skipped if missing)",
    "fortran_binary: tests requiring a compiled Fortran executable (~37s per run)",
]
# sympy 1.14's `sympy.core.evalf.bitcount` still calls `mpmath.libmp.bitcount`,
# which mpmath 1.4 deprecated. The warning fires from any code path that
# triggers sympy evalf (e.g. `lysis.config.param_resolver.resolve_micro_params`,
# which builds `sympy.Eq` / `sympy.solve` calls). We can't fix the upstream
# chain, so silence this one specific deprecation to keep test output clean.
#
# TODO(sympy>=1.15): remove this filter once sympy ships the fix.
#   Fix merged to sympy main 2025-05-11 as PR #28060
#   (https://github.com/sympy/sympy/pull/28060), expected in the 1.15 release.
#   When sympy 1.15 is out: bump the `sympy>=1.12` pin in [project].dependencies,
#   confirm the test suite runs warning-free without this filter, then delete.
filterwarnings = [
    "ignore:bitcount function is deprecated:DeprecationWarning:mpmath.libmp.libintmath",
]

[tool.black]
line-length = 88
target-version = ["py310"]
